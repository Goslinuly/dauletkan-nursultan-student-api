server:
  port: 8080

spring:
  application:
    name: dauletkan-nursultan-student-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dauletkan_nursultan_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  student-name: Dauletkan Nursultan
  group: IT2-2313
  student-id: "37037"
